name: Release

# 打 v* 标签 → 在 Windows 上真打包一次单文件 exe → 建 Release 并把 exe 当附件传上去。
# 为什么放 CI 而不是本机手工传：手工那次没人能复现「这个 exe 到底是哪个 commit 打的」，
# 而这里 tag 与包内 __version__ 会先对一次账，产物还带 SHA256。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动跑一次只产出 artifact（不建 release）

permissions:
  contents: write               # 建 release / 传附件需要

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里带 emoji/中文的 print
# 会 UnicodeEncodeError 直接打挂这一步（CI 上实测过 check_no_secrets.py 崩在「✅」）。
env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 打包脚本会读 git HEAD 做版本溯源

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # 与 README 要求一致（3.12 未测）

      - name: 对账 tag 与包内版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path vlt/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $py = $m.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  包内 __version__=$py"
          if ($tag -ne $py) {
            Write-Error "tag 与 vlt/__init__.py 的 __version__ 不一致：先改代码再打 tag"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: 打包单文件 exe
        # --no-verify：打完自带的自检要真 API key + 联网，CI 里没有 → 跳过
        run: python scripts/build_exe.py --no-verify

      - name: 自检产物（存在性 / 大小 / 图标资源）
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没找到产物 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("产物：{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          if ($f.Length -lt 20MB) { Write-Error "产物体积异常（<20MB），大概率没打全"; exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          # 只打印存档，不再产出 SHA256SUMS.txt：
          # GitHub 会在 Releases 页面为每个附件直接显示由服务端算出的 digest（可一键复制），
          # 自己再传一份同源摘要属于重复；真正的独立凭据是 GitHub 那一份。
          Write-Host ("sha256：{0}" -f $hash.ToLower())

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: |
            dist/VRChatLiveTranslate.exe
          if-no-files-found: error

      - name: 建 Release 并附上 exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # 自动附加「本版更新」：把上个 tag 以来的提交按分类列出来，
          # 免得每次发版的说明都是同一段静态文案（v0.0.1 → v0.0.2 实测过这个坑）。
          generate_release_notes: true
          body: |
            ## VRChat 实时同传 ${{ github.ref_name }}

            **下载附件里的 `VRChatLiveTranslate.exe`（单文件、免安装、无控制台），双击即用。**
            校验值看附件旁的 `sha256:`（GitHub 算的，鼠标点一下即可复制）。

            ### 用它之前需要什么
            - Windows 10/11
            - **一个阿里云百炼 API key**（自备，按量计费）：界面「⚙ 设置」粘贴保存，或设环境变量 `DASHSCOPE_API_KEY`
            - VRChat 设置里打开 **OSC**（`OSC enabled: True`）、chat bubble visibility 设为 **Everyone**

            ### 这版有什么
            - **自动检查更新**：启动时静默查一次，有新版本才弹窗（立即更新 / 稍后 / 不再提示这个版本）；下载带进度条，替换后自动拉起新版。查不到或没网完全无感
            - **界面五种语言**：简体中文 / English / 日本語 / 한국어 / Русский，默认跟随 Windows 显示语言，可在「⚙ 设置 → 界面语言」手动切换（重启后生效）
            - **打字也出声**：底栏输入框回车即发，译文走和说话完全相同的下游；勾了「译音输出」还会用 TTS 念出来送进虚拟声卡（对方能听到）
            - **稳定性**：修「模型重复输出 → 连接被服务端掐断」导致的反复掉线（改为主动重建会话）；长静音不再把连接拖死；英文/日文/韩文/俄文 Windows 上的默认声卡识别修正
            - **修 bug**：首次粘贴 API key 点保存不生效（之后「开始翻译」仍被拦）
            - 设置里新增**一键打开日志文件夹**；日志可导出脱敏压缩包

            ### 怎么用
            - 我说 → **chatbox 气泡**：麦克风 → 实时语音翻译 → 气泡里逐字刷新，句末刷最终版
            - 别人说 → **VR 手腕屏**：采集 VRChat 播放输出 → 译文渲染到 SteamVR overlay，有更新立刻上屏
            - 打字 → 不想开麦时用键盘代替麦克风，译文照常进聊天气泡 / 手腕屏 / chatbox
            - 未配置 API key 时，主界面右上角会变成「一键开通百炼」的入口

            完整说明见仓库 [README](https://github.com/nixi-agent/vrchat-livetranslate#readme)（中文 / English / 日本語 / 한국어 / Русский）。
          files: |
            dist/VRChatLiveTranslate.exe
          fail_on_unmatched_files: true
