name: Release

# 打 v* 标签 → 在 Windows 上真打包一次单文件 exe → 建 Release 并把 exe 当附件传上去。
# 为什么放 CI 而不是本机手工传：手工那次没人能复现「这个 exe 到底是哪个 commit 打的」，
# 而这里 tag 与包内 __version__ 会先对一次账，产物还带 SHA256。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动跑一次只产出 artifact（不建 release）

permissions:
  contents: write               # 建 release / 传附件需要

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里带 emoji/中文的 print
# 会 UnicodeEncodeError 直接打挂这一步（CI 上实测过 check_no_secrets.py 崩在「✅」）。
env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 打包脚本会读 git HEAD 做版本溯源

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # 与 README 要求一致（3.12 未测）

      - name: 对账 tag 与包内版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path vlt/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $py = $m.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  包内 __version__=$py"
          if ($tag -ne $py) {
            Write-Error "tag 与 vlt/__init__.py 的 __version__ 不一致：先改代码再打 tag"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: 打包单文件 exe
        # --no-verify：打完自带的自检要真 API key + 联网，CI 里没有 → 跳过
        run: python scripts/build_exe.py --no-verify

      - name: 自检产物（存在性 / 大小 / 图标资源）
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没找到产物 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("产物：{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          if ($f.Length -lt 20MB) { Write-Error "产物体积异常（<20MB），大概率没打全"; exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # ⚠️ 过渡期必须继续产出 SHA256SUMS.txt：**≤ v0.2.0 的老客户端把「exe + SHA256SUMS.txt
          #    两个附件」写死在更新检查里**，缺一个就静默地永远查不到新版本（v0.2.0 → v0.2.1 实测踩到）。
          #    新客户端优先用 GitHub 的 asset digest，这个文件纯粹给老客户端兜底。
          "$hash  VRChatLiveTranslate.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host ("sha256：{0}" -f $hash)

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 建 Release 并附上 exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # 正式版：会被 /releases/latest 视为最新版（客户端更新检查据此提示升级）。
          # 上游 0.4 自己发的 beta.1 是 pre-release（不参与「最新版」判断）；
          # 本仓库把同一批内容作为**正式版**发布，所以这里是 false。
          prerelease: false
          # 关掉自动附加的「What's Changed / New Contributors」（上游 2026-09 起的既有策略）：
          # 说明**只留下面这一段**，每个版本都手写 —— 不靠 GitHub 代列 PR。
          generate_release_notes: false
          body: |
            ## VRChat 实时同传（增强版）${{ github.ref_name }}

            > 本 Release 来自 [@Sand-85](https://github.com/Sand-85) 维护的**独立增强版**仓库，基于上游
            > [nixi-agent/vrchat-livetranslate](https://github.com/nixi-agent/vrchat-livetranslate)（MIT，版权归原作者）。
            > 本包 = 上游 **v0.8.0** 的内容 + 下面列的增强（版本号走本仓库自己的线：
            > v0.4.0 / v0.4.2 / v0.4.3 / v0.5.2 / v0.6.1 已发过，本版 **v0.8.1**）。

            **下载附件里的 `VRChatLiveTranslate.exe`（单文件、免安装、无控制台），双击即用。**
            校验值看附件旁的 `sha256:`；`SHA256SUMS.txt` 是给老客户端识别更新用的，手动下载不需要它。

            ### 用它之前需要什么
            - Windows 10/11
            - **一个千问云 API key**（自备，按量计费）：界面「⚙ 设置」粘贴保存，或设环境变量 `DASHSCOPE_API_KEY`
            - VRChat 设置里打开 **OSC**（`OSC enabled: True`）、chat bubble visibility 设为 **Everyone**

            ### 本版重点①：设置里多了「音色」页 —— 自己炼音色 / 克隆音色
            - **一句话炼音色**：写一句描述（例如「低沉、语速偏慢的男声」）→ 生成 → 试听 → 满意就「保存为当前音色」。
              0.2 元/个（前 10 个免费）；点生成前会先弹一次费用确认。另附 **5 条预制配方**，一键生成。
            - **音色克隆（新）**：上传一段 **10~20 秒、≥24kHz 的单人朗读**（wav/mp3/m4a）→ 复刻成音色 → 自动试听。
              素材在**本地先校验**（时长/采样率/声道/体积不合格当场拦下，不白花那 0.01 元）；
              账号里已有同名音色会**直接复用、不重复花钱**；复刻需服务端审核，未通过的会在列表里标注。
            - **克隆预设（新）**：内置一条范本 —— **「试听范本」**（本地播放、不花钱）与 **「一键克隆」**。
            - **试听明码标价**：命中本地缓存不花钱；没有缓存时才用固定句子合成一句（约 0.003 元）。
            - 本账号的自定义音色（自己炼的、复刻的）现在都能在 **「⚙ 设置 → 音频 → 打字译音」下拉**里直接选，
              **不用再手抄一长串 id**；换音色时会自动配对上正确的合成模型（换错模型是真机上必失败的那种错）。

            ### 本版重点②：说完 → 出最终译文 更快（快封句）
            - 以前：停止说话后还要等 ~2.1 秒才定型（只等「文字静默」）。
            - 现在：**麦克风也静了**就提前定型 → 本机实测 **+2.17s → +0.62s**（这条已作为 PR 提给上游）。

            ### 本版重点③：上游 v0.7.x / v0.8.0 的内容也进来了
            - **海外线路换「千问云·海外版（Qwen Cloud）」**：地址改为 `maas.qwencloudapi.com`，设置里
              **不再需要填地域 / 业务空间**；老配置里的线路名会自动迁移。
            - 两条服务线路（千问云 / 阿里云百炼）**界面可切换**，key 分开存槽。
            - **泰语（th）方向**支持，含泰文字体回退与中泰混排。
            - **设备与 loopback 修复**：设备表收敛到 WASAPI 已启用设备（本机 150 → 33 条，不再出现
              「同一设备重复出现、采样率不一致」）、loopback 按设备**原生声道数**打开（修 7.1/8 声道设备
              「一条都收不到」）、麦克风按原生采样率开。
            - **「关于」页赞助者名单**；Linux 原生桌面字幕（随代码带入；**本仓库不发 Linux 版**）。

            ### 相对上游的持续增强（本仓库）
            - **译音音源 A/B 热切换**（不用重启）；**流式合成**让打字腿「开口」从 ~1.7s 降到 **~0.52s**
              （已回馈上游并被合并 ✅）；**语速可调** / cosyvoice `seed`（同句可复现）；
              **修「整段反复重念」**（多路合成改为单飞队列，写入不乱序）；**更新检查指向本仓库**。
            - **房间（多人文字中继）**：同房间的人能在各自的**手腕屏 / 桌面字幕**上看到你说的话
              （只广播你自己的话、不出声、默认关闭）。
            - **桌面字幕**（贴 VRChat 窗口的叠加窗）、**手腕屏位姿按锚点分开存**、**输入门限实时电平**、
              `--selfcheck` 安装自检。设置分页：常规 / 音频 / 音色 / 词库 / 房间 / 关于。
            - **通联开关音**：每句话开头播「开台」、结尾播「收台」音效（只作用于 TTS 出声，可在配置里关）。

            ⚠️ **本仓库只提供 Windows 版**：包与说明都以 Windows 为准，不含 Linux 构建。

            ### 怎么用
            - 我说 → **chatbox 气泡**：麦克风 → 实时语音翻译 → 气泡里逐字刷新，句末刷最终版
            - 别人说 → **VR 手腕屏**：采集 VRChat 播放输出 → 译文渲染到 SteamVR overlay，有更新立刻上屏
            - 打字 → 不想开麦时用键盘代替麦克风，译文照常进聊天气泡 / 手腕屏 / chatbox
            - 房间 → **同房间其他人的手腕屏**：只广播你自己说的话，文字中继、不出声（默认关闭）
            - 未配置 API key 时，主界面右上角会变成「一键开通千问云」的入口

            完整说明见仓库 [README](https://github.com/Sand-85/vrchat-livetranslate-extra#readme)（中文 / English / 日本語 / 한국어 / Русский）。
          files: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
