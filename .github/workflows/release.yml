name: Release

# 打 v* 标签 → 在 Windows 上真打包一次单文件 exe → 建 Release 并把 exe 当附件传上去。
# 为什么放 CI 而不是本机手工传：手工那次没人能复现「这个 exe 到底是哪个 commit 打的」，
# 而这里 tag 与包内 __version__ 会先对一次账，产物还带 SHA256。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动跑一次只产出 artifact（不建 release）

permissions:
  contents: write               # 建 release / 传附件需要

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里带 emoji/中文的 print
# 会 UnicodeEncodeError 直接打挂这一步（CI 上实测过 check_no_secrets.py 崩在「✅」）。
env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 打包脚本会读 git HEAD 做版本溯源

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # 与 README 要求一致（3.12 未测）

      - name: 对账 tag 与包内版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path vlt/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $py = $m.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  包内 __version__=$py"
          if ($tag -ne $py) {
            Write-Error "tag 与 vlt/__init__.py 的 __version__ 不一致：先改代码再打 tag"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: 打包单文件 exe
        # --no-verify：打完自带的自检要真 API key + 联网，CI 里没有 → 跳过
        run: python scripts/build_exe.py --no-verify

      - name: 自检产物（存在性 / 大小 / 图标资源）
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没找到产物 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("产物：{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          if ($f.Length -lt 20MB) { Write-Error "产物体积异常（<20MB），大概率没打全"; exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # ⚠️ 过渡期必须继续产出 SHA256SUMS.txt：**≤ v0.2.0 的老客户端把「exe + SHA256SUMS.txt
          #    两个附件」写死在更新检查里**，缺一个就静默地永远查不到新版本（v0.2.0 → v0.2.1 实测踩到）。
          #    新客户端优先用 GitHub 的 asset digest，这个文件纯粹给老客户端兜底。
          "$hash  VRChatLiveTranslate.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host ("sha256：{0}" -f $hash)

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 建 Release 并附上 exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # 正式版：会被 /releases/latest 视为最新版（客户端更新检查据此提示升级）。
          # 上游 0.4 自己发的 beta.1 是 pre-release（不参与「最新版」判断）；
          # 本仓库把同一批内容作为**正式版**发布，所以这里是 false。
          prerelease: false
          # 关掉自动附加的「What's Changed / New Contributors」（上游 2026-09 起的既有策略）：
          # 说明**只留下面这一段**，每个版本都手写 —— 不靠 GitHub 代列 PR。
          generate_release_notes: false
          body: |
            ## VRChat 实时同传（增强版）${{ github.ref_name }}

            > 本 Release 来自 [@Sand-85](https://github.com/Sand-85) 维护的**独立增强版**仓库，基于上游
            > [nixi-agent/vrchat-livetranslate](https://github.com/nixi-agent/vrchat-livetranslate)（MIT，版权归原作者）。
            > 本包 = 上游 **v0.11.3** 的内容 + 下面列的增强（**不含**上游 0.12.0 的耳返 / process loopback）。
            > **自 v0.8.2 起，本仓库版本号与上游脱钩**（不再跟随上游的号走）：已发过
            > v0.3.1 / v0.3.2 / v0.4.0 / v0.4.2 / v0.4.3 / v0.5.2 / v0.6.1 / v0.8.1 / v0.8.2 / v0.8.3 / v0.9.0 / v0.10.0 / v0.10.1 / v0.11.0 / v0.11.1，本版 **v0.11.2**。

            **下载附件里的 `VRChatLiveTranslate.exe`（单文件、免安装、无控制台），双击即用。**
            校验值看附件旁的 `sha256:`；`SHA256SUMS.txt` 是给老客户端识别更新用的，手动下载不需要它。

            ### 用它之前需要什么
            - Windows 10/11
            - **一个千问云 API key**（自备，按量计费）：界面「⚙ 设置」粘贴保存，或设环境变量 `DASHSCOPE_API_KEY`
            - VRChat 设置里打开 **OSC**（`OSC enabled: True`）、chat bubble visibility 设为 **Everyone**

            ### 本版说明（v0.11.2）

            **本版 = 一次「延迟」为主的更新：先把最慢的那一跳干掉，再补三处会让功能「看起来坏了」的毛病，
            同时跟到上游 v0.11.3。**

            **① 断句延迟：说完 → 出译文 4.0s → 0.5s（本版最有用的一条）** —— 上游 PR #112
            - 以前客户端**什么都不下发**断句参数，服务端按默认的 `speaker_detection` 收尾，实测要 **3.90s** 才断句
              （断句之后模型自己只要 0.13~0.20s ⇒ 慢在断句，不在模型）。
            - 现在下发 `server_vad` + **500ms** 静音断句：端到端 **0.53s**。
            - 想自己调：`config.yaml` → `session.silence_duration_ms`（**200~6000**，默认 500）。
              ⚠️ 别低于 500：上游实测 300ms 会**吞句首**（10 句里 4 句丢开头）。

            **② 换「译音输出」设备即时生效** —— 上游 PR #114（修「改了设备却只能重启」）
            - 以前代理只在启动时解析一次输出设备：设置页换了设备，配置和界面都变了、声音还播进旧端点。
            - 现在切换成功会状态栏提示「译音输出已切换：旧 → 新」；失败**保留旧端点**并明确告知；同一台设备不重开。

            **③ 服务端限流不再 2s 一撞**（治「俄语失效 / 一直不动」）
            - 真因不是俄语：服务端回 `1007 Requests rate limit exceeded`，而我们每次重连都从 2s 重新数退避，
              等于每 2s 再撞一次、把限流窗口一直续着 → 两条腿都连不上，**换哪个语言都一样**。
            - 现在识别限流，走 **30 / 60 / 120s** 台阶（且台阶跨会话累计），状态栏直说「服务端限流：N 秒后再试」，
              并提示**这段时间别反复切语言/重开**。

            **④ 源语言 = 译入语言 → 这个方向不翻译**
            - 语音腿**不再连服务端**（服务端没有「不翻」的表达，同语言发下去只是让模型原样回吐：白花连接与 token，
              还会招来「连续雷同译文 → 掐线重连」那套病态）。
            - 打字腿照常：本地直通 + TTS 念原文，**不经过会话**。
            - 注意：同语种的语音腿因此**不出字幕**（没有 ASR）。

            **⑤ 译音被截断的两笔修复**（上一版之后陆续修的）
            - 「一句话只念半句」：收尾判据曾把服务端在逗号处的 250ms 纯零当成句尾 → 已改为只看「1.0s 断供 + 末帧安静」。
            - 「长文本只念一部分」：长句里服务端分句停顿同样会同时满足旧判据 → 同一修法覆盖，并补了离线用例。

            **⑥ 音色页：「删除所选」挪到「过往生成」列表右侧**（挨着「试听所选 / 刷新列表」），不再挤在生成按钮行里。

            **⑦ 跟到上游 v0.11.3**（真机修过的一批）
            - 手腕屏降级说明进 GUI 状态栏（D3D 起不来时不再只有日志）+ D3D 定点重试跟随 `_closed` 纪律 + `start()` 归零自愈
            - 韩文显示成方框：按**书写系统**切 run 泛化（泰文那套推广到多书写系统），并补了 Linux 侧字体查找
            - 输入门限关闸时补 600ms 等长静音（别在时间轴上挖洞）

            **⑧ 工程侧（用户看不到，但影响发版可信度）**
            - 发版复核脚本：解包工具按可信度排序 + 逐个真试（PATH 上的坏工具不再挡住好工具，也不再假红）
            - 打字输入补了 7 项接线验收（含「每个调用点必须传齐 4 个实参」的静态检查）

            **已知缺口（本版没有，别找）**
            - **耳返（sidetone）**：上游 0.12.0 的新功能，我们**暂不发**。
            - **Windows process loopback（只抓 VRChat 进程）**：同上，暂不发 —— 所以「别人说话」那条腿目前仍抓整个输出端点
              （浏览器 / 音乐 / 系统音会被一起送进模型）。这条我们后续再做。

            ### 本包包含（自更早版本起就有）

            **① 更早开口 / 更快出声（延迟）**
            - **输入分块 100ms → 40ms**：字一出口就上送，句首更快（采集设备块同步变细）
            - **输入门限放宽**（-45 → **-50 dB**，preroll 250 → 300ms）：说得轻、离麦远时不再被压住半天不开闸
            - **TTS 连接复用**：每段省掉一次 DNS+TCP+TLS 握手（3 句 A/B 实测：后两段各省 94 / 186ms）
            - **音频 / 引擎线程提到高优先级**：治调度抖动（本地实测重采样单核只占 0.4%，
              瓶颈从来不是吞吐 —— 全流程 ASR / 翻译 / TTS 都在云上）
            - 想看延迟构成：设 `VLT_LATENCY_TRACE=1` 再启动，每段会打一行
              `[lat] 段「…」 队=… 连接=… 首包=… 合成=… 写卡=… 总=…`（默认关闭，零开销）
            - 进阶开关：`output.audio.segment_early: true` 可在逗号 / 12 字处先切一刀（更早开口、
              一句更碎，**默认关闭**）；`text_input.tts.reuse_conn: false` 可退回每次新建连接

            **② 音源 A/B 只管「我说的话」**
            - 「VRC 音频捕捉」（别人说话 → 手腕屏）**恒定走 A 实时音源**：不会因为选了 B 而关掉实时
              音频输出、也不多做一次本地合成；只有「我说的话」那一路可自由选 A / B

            **③ 音色页三处修复**（来自协作 agent 的 PR）
            - 试听**没有声音**、试听**卡住界面**、原声档下译音被**静默丢弃** —— 都已修

            **④ 更早跟的上游 v0.10.0**
            - **「开始 / 停止」合并成一个按钮**（蓝 ⇄ 红，点击即切换；收尾期间红底置灰；两态逐字同尺寸）
            - 勾了「译音输出」时，**开始翻译默认切到译音档**（可手动切回原声档）
            - 修：**桌面字幕 / 手腕屏**「窗能显示，但收不到原文译文、拖不动、改配置无效」
            - 修：**设置页拖滑块不落盘**；修：**麦克风下拉永远显示「自动检测」**
            - 新：空聊天区居中**占位提示**；**Windows DPI 感知**（高缩放屏文字不发虚）
            - 新：**`ui.scale` 界面缩放**（`auto` 跟随系统，或写数值强制整体缩放）

            ### 本包还包含（自上一版起就有）
            - **设置 → 音色**：一句话炼自己的音色（0.2 元/个，北京地域开通后前 10 个免费）+ 5 条预制配方；
              **音色克隆**（上传 10~20 秒、≥24kHz 单人朗读 → 复刻 → 自动试听）；**克隆预设**（试听范本 / 一键克隆）。
              试听命中本地缓存不花钱，现合成约 0.003 元（界面常显标价）。
            - **打字译音下拉**直接列出你自己的音色（含复刻的），换音色时自动配对正确的合成模型。
            - 克隆预设的范本样本**托管在仓库**（独立 `vo_sample/` 目录 + 清单），按需拉取、**每次启动联网查一次更新**。
            - 上游 v0.7.x / v0.8.0 的内容：两条服务线路可切（含「千问云·海外版」）、**泰语**方向、
              设备表收敛到 WASAPI 已启用项、loopback 按原生声道数打开。
            - 更早的持续增强：译音音源 A/B 热切换、流式合成（打字腿开口 ~1.7s → ~0.52s）、语速可调、
              修「整段反复重念」、更新检查指向本仓库、房间（多人文字中继）、桌面字幕、
              手腕屏位姿按锚点分开存、输入门限实时电平、`--selfcheck` 自检。

            ⚠️ **本仓库只提供 Windows 版**：包与说明都以 Windows 为准，不含 Linux 构建。

            ### 怎么用
            - 我说 → **chatbox 气泡**：麦克风 → 实时语音翻译 → 气泡里逐字刷新，句末刷最终版
            - 别人说 → **VR 手腕屏**：采集 VRChat 播放输出 → 译文渲染到 SteamVR overlay，有更新立刻上屏
            - 打字 → 不想开麦时用键盘代替麦克风，译文照常进聊天气泡 / 手腕屏 / chatbox
            - 房间 → **同房间其他人的手腕屏**：只广播你自己说的话，文字中继、不出声（默认关闭）
            - 未配置 API key 时，主界面右上角会变成「一键开通千问云」的入口

            完整说明见仓库 [README](https://github.com/Sand-85/vrchat-livetranslate-extra#readme)（中文 / English / 日本語 / 한국어 / Русский）。
          files: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
